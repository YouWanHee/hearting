name: Checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # A release's called Checks must not cancel an ordinary Checks run.
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adaptation-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # ci_scope.py asks the Actions API whether a PR run already passed this tree.
      actions: read
    outputs:
      full_tests: ${{ steps.scope.outputs.full_tests }}
    steps:
      - name: Check out the source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select checks for the changed files
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release/ci_scope.py >> "$GITHUB_OUTPUT"

      - name: Record the scope decision
        env:
          FULL_TESTS: ${{ steps.scope.outputs.full_tests }}
          SCOPE_REASON: ${{ steps.scope.outputs.reason }}
        run: |
          echo "Expensive suites: full_tests=$FULL_TESTS (reason: $SCOPE_REASON)" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify generated projections
        run: python3 tools/generate.py --check

      - name: Verify the published landing surface
        run: python3 tools/render-landing.py --check

      - name: Verify adaptation boundary
        run: ./tools/check-adaptation-boundary.sh

      - name: Verify model-config single source
        run: python3 tools/check-model-config.py

      - name: Verify unit-catalog contract
        run: python3 tools/check-unit-config.py

      - name: Verify scope placeholder vocabulary
        run: python3 tools/check-scope-placeholders.py

  install-lifecycle:
    needs: adaptation-boundary
    if: needs.adaptation-boundary.outputs.full_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run launcher binding suites
        run: |
          python3 tools/install/codex_launcher.test.py
          python3 utilities/codex_launcher.test.py

      - name: Verify destructive mutation safety
        run: |
          python3 tools/install/check_destructive_calls.py tools/install
          python3 tools/install/test_destructive_guard.py
          python3 tools/install/test_fixture_env.py
          python3 tools/install/test_safe_fs.py
          python3 tools/install/test_distribution_safe.py
          python3 tools/install/deletion_safety.test.py
          python3 tools/install/installer_runtime.test.py

      - name: Run activation and lifecycle suites
        run: |
          ./tools/install/runtime-activation.test.sh
          ./tools/install/projection-completeness.test.sh
          ./tools/install/release-lifecycle.test.sh
          ./tools/install/extension-lifecycle.test.sh

      - name: Check the installed-layout regression trigger (C-4)
        run: python3 tools/check-installed-layout-trigger.py --base HEAD~1 --head HEAD

  dispatch-pid-namespace:
    needs: adaptation-boundary
    if: needs.adaptation-boundary.outputs.full_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install PID namespace fixture
        run: |
          # A stalled mirror once hung apt for the full 6h job budget; keep
          # the fetch bounded and retried instead.
          sudo timeout 300 apt-get -o Acquire::Retries=3 update
          sudo timeout 300 apt-get -o Acquire::Retries=3 install --yes bubblewrap
          # Ubuntu 24.04 runners confine unprivileged user namespaces via
          # AppArmor, so bwrap dies with "setting up uid map: Permission
          # denied" before the suite starts.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Verify Codex detached receipt and marker ordering
        env:
          HEARTING_REQUIRE_PIDNS: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 utilities/dispatch_namespace_e2e.test.py -v

  full-suite-shard:
    needs: adaptation-boundary
    if: needs.adaptation-boundary.outputs.full_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      # Every shard reports even when a sibling fails, so one run shows all causes.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out the source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install full-suite tracing fixtures
        run: |
          if command -v rg >/dev/null && command -v strace >/dev/null; then
            exit 0
          fi
          sudo timeout 300 apt-get -o Acquire::Retries=3 update
          sudo timeout 300 apt-get -o Acquire::Retries=3 install --yes ripgrep strace

      - name: Run shard ${{ matrix.shard }} of the full isolated test suite (C-3/C-4)
        # --seed-baseline uploads the proposed rows stamped with this runner's
        # fingerprint; adopting them is a human decision, never automatic.
        # A known failure that now passes is reported, not failed: a fix
        # should not turn the build red until its baseline row is dropped.
        # The shard is split from tools/test-durations.tsv, so every runner
        # computes the same partition; --suite-list is written before any
        # suite runs and lets the aggregate job prove nothing was dropped.
        run: |
          mkdir -p "${{ runner.temp }}/shard-out"
          python3 tools/run-tests.py --retries 1 \
            --shard ${{ matrix.shard }}/4 \
            --suite-list ${{ runner.temp }}/shard-out/suite-list.tsv \
            --xpass-nonfatal \
            --strict-leak-sweep \
            --report ${{ runner.temp }}/shard-out/run-tests-report.tsv \
            --diagnostics-dir ${{ runner.temp }}/shard-out/run-tests-diagnostics \
            --seed-baseline ${{ runner.temp }}/shard-out/run-tests-seed-baseline.tsv

      - name: Upload shard report, manifest and baseline seed
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: run-tests-report-shard-${{ matrix.shard }}-of-4
          path: ${{ runner.temp }}/shard-out
          if-no-files-found: ignore
          # A re-run of a failed shard replaces the earlier attempt's artifact.
          overwrite: true

  # The required check keeps its historical name; it now means "every shard ran
  # and together they cover the whole census".
  full-test-suite:
    name: full-test-suite
    needs: [adaptation-boundary, full-suite-shard]
    if: always() && needs.adaptation-boundary.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every shard to have succeeded
        if: needs.adaptation-boundary.outputs.full_tests == 'true'
        env:
          SHARDS: ${{ needs.full-suite-shard.result }}
        run: |
          if [ "$SHARDS" != success ]; then
            echo "full-suite-shard result is '$SHARDS'; shard reports are in the run artifacts" >&2
            exit 1
          fi

      - name: Check out the source
        if: needs.adaptation-boundary.outputs.full_tests == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the shard reports
        if: needs.adaptation-boundary.outputs.full_tests == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: run-tests-report-shard-*-of-4
          path: ${{ runner.temp }}/shards

      - name: Verify the shards add up to the census
        if: needs.adaptation-boundary.outputs.full_tests == 'true'
        run: |
          python3 tools/run-tests.py --census \
            --suite-list "${{ runner.temp }}/shards/census-suite-list.tsv"
          status=0
          python3 tools/run-tests.py --verify-shards "${{ runner.temp }}/shards" \
            > "${{ runner.temp }}/verify-shards.txt" || status=$?
          cat "${{ runner.temp }}/verify-shards.txt"
          {
            echo '### Shard coverage'
            echo '```'
            cat "${{ runner.temp }}/verify-shards.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # Marks this merge-result tree as fully validated, for ci_scope.py on a later
  # main push. Written only after every expensive job passed on a pull request;
  # documentation-only, failed, cancelled and partial runs leave no marker.
  validated-tree-marker:
    needs: [adaptation-boundary, install-lifecycle, dispatch-pid-namespace, full-test-suite]
    if: >-
      github.event_name == 'pull_request' &&
      needs.adaptation-boundary.outputs.full_tests == 'true' &&
      needs.adaptation-boundary.result == 'success' &&
      needs.install-lifecycle.result == 'success' &&
      needs.dispatch-pid-namespace.result == 'success' &&
      needs.full-test-suite.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the tested merge result
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Record the validated tree
        id: tree
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          mkdir -p "${{ runner.temp }}/marker"
          printf '{"tree":"%s","merge_sha":"%s","run_id":"%s"}\n' \
            "$tree" "$GITHUB_SHA" "$GITHUB_RUN_ID" > "${{ runner.temp }}/marker/validated-tree.json"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

      - name: Upload the validated-tree marker
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validated-tree-${{ steps.tree.outputs.tree }}
          path: ${{ runner.temp }}/marker/validated-tree.json
          overwrite: true
