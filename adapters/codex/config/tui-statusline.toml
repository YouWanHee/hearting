# Codex-owned TUI preference fragment.
#
# `/statusline` persists these values in $CODEX_HOME/config.toml under [tui].
# The shared installer merge also inserts the root startup-update default when
# that key is absent; explicit true/false values stay user-owned. Keep the rest
# of config.toml runtime-owned because it also stores local project trust,
# hook trust hashes, plugin state, model defaults, credentials pointers, and
# other user/session state.
#
# Apply this fragment with `adapters/codex/bin/preflight.sh tui-config`, or
# add `"thread-id"` last in the existing status_line array manually.

# `thread-id` exposes Codex's full current Thread.id to the normal foreground
# observer. Keep it last so the full UUID remains visible after optional
# telemetry and title fields. The pane header remains the shared human-facing
# session label; `thread-title` remains available as a separate title.

[tui]
status_line = ["thread-title", "git-branch", "context-used", "model-with-reasoning", "five-hour-limit", "weekly-limit", "thread-id"]
status_line_use_colors = true
